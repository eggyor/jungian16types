<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>理論文章｜{{ site.title | default: "經典榮格 Classic Jung" }}</title>
<meta name="description" content="{{ page.description | escape }}">
<link rel="stylesheet" href="{{ '/assets/css/site-chrome.css' | relative_url }}">
{% include site-theme-links.html %}
<style>
:root{
  --bg:#F7F4EC; --card:#FBFAF6; --line:#DED7C8; --line2:#CFC4AA; --line3:#E8E1D3;
  --navy:#30483B; --beige:#EEE8D9; --tan:#987746; --text:#454A43; --muted:#777568; --gold:#C9AA70;
  --serif:var(--cj-font-family,"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU",serif);
  --sans:var(--cj-font-family,"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU",serif);
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5;
  background-image:radial-gradient(#D9D1BE 1px,transparent 1px);background-size:22px 22px}
button,input{font-family:inherit}
a{color:inherit}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1120px;margin:0 auto;padding:0 32px}

/* top bar */
.top{background:var(--navy);color:var(--card)}
.top .wrap{min-height:56px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 24px}
.brand{font-family:var(--serif);font-size:18px;letter-spacing:.06em}
.topnav{display:flex;flex-wrap:wrap;align-items:center}
.topnav span{padding:16px 14px;font-size:14px;opacity:.78;border-bottom:3px solid transparent}
.topnav span.on{opacity:1;font-weight:700;border-bottom-color:var(--gold)}

/* sub header */
.subbar{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 1px 4px rgba(23,48,79,.06)}
.tabs{display:flex;flex-wrap:nowrap;align-items:stretch;overflow-x:auto;scrollbar-width:thin}
.tab{display:flex;align-items:center;justify-content:center;align-self:stretch;flex:0 0 auto;min-height:48px;padding:0 20px;border:0;border-bottom:3px solid transparent;background:transparent;line-height:1.4;
  color:var(--muted);font-family:var(--serif);font-size:15px;white-space:nowrap;cursor:pointer;transition:color .2s ease}
.tab{text-decoration:none}.tab:hover{color:var(--navy)}
.tab[aria-selected="true"]{color:var(--navy);font-weight:600;border-bottom-color:var(--navy)}
.tab.sep{border-right:1px solid var(--line2)}
.tab:focus-visible,.btn:focus-visible,.chip:focus-visible,.row:focus-visible,.feat:focus-visible,input:focus-visible,.primary:focus-visible,.ghost:focus-visible,.xbtn:focus-visible,.disc:focus-visible{outline:3px solid #2B6CB0;outline-offset:2px}

/* stage & panels */
main.wrap{padding-top:22px;padding-bottom:36px}
.stage{position:relative;overflow:hidden}
.stage.ready{transition:height .35s ease}
.panel{position:absolute;top:0;left:0;right:0;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(8px);
  transition:opacity .35s ease,transform .35s ease,visibility 0s .35s}
.panel.active{opacity:1;visibility:visible;pointer-events:auto;transform:none;
  transition:opacity .35s ease .05s,transform .35s ease .05s,visibility 0s}
.phead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
.phead h1{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(28px,4.4vw,38px);letter-spacing:.04em;color:var(--navy)}
.phead .en{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--muted)}
.lead{margin:4px 0 0;font-size:14px;color:#55524A}
.banner{margin:12px 0 14px;width:100%;aspect-ratio:2272 / 464;border-radius:8px;overflow:hidden;background:var(--beige)}
.banner img{display:block;width:100%;height:100%;object-fit:cover}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;box-shadow:0 1px 3px rgba(23,48,79,.06)}

/* dictionary groups */
.groups{display:flex;flex-direction:column;gap:8px}
.grp{display:flex;flex-wrap:wrap;gap:8px}
.glabel{flex:1 1 172px;max-width:172px;background:var(--beige);border:1px solid var(--line);border-radius:6px;padding:10px 12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.glabel b{font-family:var(--serif);font-weight:600;font-size:16px;line-height:1.4;color:var(--navy);text-wrap:balance}
.gbody{flex:999 1 420px;min-width:0;background:#fff;border:1px solid var(--line3);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.gbody > .intro{margin:0;font-size:13.5px;line-height:1.5;color:#55524A}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{min-height:36px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:4px 14px;border:1px solid var(--navy);border-radius:4px;
  background:var(--bg);color:var(--navy);font-size:14px;font-weight:700;text-align:center;line-height:1.35;cursor:pointer;transition:background .15s ease,color .15s ease}
.btn:hover{background:var(--navy);color:var(--card)}
.bt{display:flex;flex-direction:column;align-items:center;text-align:center;gap:0}
.btn.multi{padding:5px 10px}
.btn.multi .b1{font-size:15px}
.btn.multi .b2{font-size:13px;font-weight:500}
.btn.multi .b2:last-child{font-size:12px;font-weight:400;opacity:.85}
.sub + .sub{margin-top:2px}
.sub h3{margin:0 0 6px;padding-left:10px;border-left:3px solid var(--tan);font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.5;color:var(--navy)}

/* matrix (inside a dictionary row) */
.matrix{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:6px}
.matrix.lab{grid-template-columns:120px repeat(var(--n,2),minmax(0,1fr))}
.mh{background:var(--navy);color:var(--card);border-radius:4px;padding:6px 10px;text-align:center;font-weight:700;font-size:13.5px;line-height:1.35;display:flex;align-items:center;justify-content:center}
.mh.blank{background:none;padding:0}
.ml{background:var(--beige);border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.ml b{font-family:var(--serif);font-size:15px;line-height:1.35;color:var(--navy)}
.ml small{font-size:12px;color:#5E5440;line-height:1.35}
.mc{background:var(--card);border:1px solid var(--line3);border-radius:6px;padding:6px;display:flex;flex-direction:row;flex-wrap:wrap;align-items:stretch;gap:6px}
.mc .btn{flex:1 1 112px;min-width:0;background:#fff}
.mc .btn:hover{background:var(--navy)}
.mcap{display:none;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--navy);padding-left:10px;border-left:3px solid var(--tan)}

/* function-stack table (collapsible) */
.disc{align-self:flex-start;min-height:36px;display:inline-flex;align-items:center;gap:10px;padding:0 18px;border:1px solid var(--navy);border-radius:4px;
  background:var(--bg);color:var(--navy);font-size:14px;font-weight:700;cursor:pointer;transition:background .15s ease,color .15s ease}
.disc:hover{background:var(--navy);color:var(--card)}
.disc .chev{width:10px;height:10px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);transition:transform .25s ease}
.disc[aria-expanded="true"] .chev{transform:rotate(-135deg) translate(-2px,-2px)}
.collapse{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.collapse.open{grid-template-rows:1fr}
.cin{min-height:0;overflow:hidden;visibility:hidden;transition:visibility 0s .35s}
.collapse.open .cin{visibility:visible;transition:visibility 0s}
.tscroll{overflow-x:auto;border:1px solid var(--line3);border-radius:6px}
table.stack{width:100%;min-width:440px;border-collapse:collapse;background:#fff;font-size:13.5px;line-height:1.35}
.stack th,.stack td{padding:5px 10px;text-align:center;border-bottom:1px solid var(--line3)}
.stack thead th{background:var(--navy);color:var(--card);font-size:13px;font-weight:700}
.stack thead th.un{background:#3A5576}
.stack thead tr:first-child th + th{border-left:1px solid rgba(250,248,242,.3)}
.stack tr.gh td{background:var(--beige);color:var(--navy);font-family:var(--serif);font-weight:600;text-align:left}
.stack tbody th{font-weight:700;color:var(--navy);text-align:left;white-space:nowrap}
.stack td.dom{font-weight:700;color:var(--navy)}
.stack td.sep{border-left:2px solid var(--line2)}
.stack tbody tr:last-child th,.stack tbody tr:last-child td{border-bottom:0}

/* lists */
.note{margin:0 0 10px;padding:7px 12px;border:1px dashed var(--navy);border-radius:6px;background:#fff;font-size:13.5px;color:var(--navy)}
.feat{display:flex;flex-direction:column;gap:4px;padding:12px 16px;margin-bottom:10px;border-radius:8px;background:var(--navy);color:var(--card);text-decoration:none}
.feat:hover{background:#1E3C61}
.feat[hidden]{display:none}
.feat .flag{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--gold)}
.feat .ft{font-family:var(--serif);font-size:20px;line-height:1.35}
.feat .fe{font-size:14px;line-height:1.55;opacity:.92}
.feat .fd{font-size:12px;opacity:.78}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.toolbar input{flex:1 1 260px;min-height:38px;padding:0 14px;border:1px solid var(--line2);border-radius:4px;background:#fff;color:var(--text);font-size:14px}
.count{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.chip{min-height:30px;padding:0 12px;border:1px solid var(--line2);border-radius:999px;background:#fff;color:var(--navy);font-size:13px;font-weight:500;cursor:pointer}
.chip:hover{border-color:var(--navy)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--card)}
.rows{display:flex;flex-direction:column}
.row{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:6px 16px;padding:10px 8px;border-bottom:1px dashed var(--line);border-radius:4px;
  text-decoration:none;color:inherit}
.row:hover{background:var(--bg)}
.rmain{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:2px}
.rtitle{font-size:16px;font-weight:700;color:var(--navy);line-height:1.4}
.rex{margin:0;font-size:13.5px;line-height:1.55;color:#55524A}
.rdate{font-size:12px;color:var(--muted)}
.rtags{display:flex;flex-wrap:wrap;gap:6px;max-width:240px;justify-content:flex-end}
.tag{padding:1px 9px;border-radius:999px;background:var(--beige);color:#5E5440;font-size:12px}
.empty{padding:36px 10px;text-align:center;color:var(--muted);font-size:14px}
.more{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:10px}
.more[hidden]{display:none}
.shown{font-size:12px;color:var(--muted)}

/* load-more animation & end message */
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.row.enter,.endmsg.enter{animation:rowIn .45s ease both;animation-delay:calc(var(--i,0) * 60ms)}
.endmsg{display:flex;align-items:center;gap:14px;margin:6px 0 0;font-size:13px;color:var(--muted)}
.endmsg::before,.endmsg::after{content:"";flex:1;height:1px;background:var(--line)}
.endmsg[hidden]{display:none}

.demo-note{margin:18px 0 0;text-align:center;font-size:12px;color:var(--muted)}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;visibility:hidden;
  transition:opacity .25s ease,visibility 0s .25s}
.modal.open{opacity:1;visibility:visible;transition:opacity .25s ease,visibility 0s}
.backdrop{position:absolute;inset:0;background:rgba(23,48,79,.5)}
.dlg{position:relative;width:640px;max-width:100%;max-height:calc(100vh - 32px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:18px 30px 20px;box-shadow:0 12px 40px rgba(23,48,79,.28);display:flex;flex-direction:column;gap:10px;transform:translateY(10px);transition:transform .25s ease}
.modal.open .dlg{transform:none}
.dtop{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.dchip{padding:4px 12px;border-radius:4px;background:var(--beige);color:var(--text);font-size:14px;line-height:1.5}
.xbtn{flex:0 0 auto;width:44px;height:44px;border:0;background:transparent;color:var(--text);font-size:28px;line-height:1;cursor:pointer}
.dlg h2{margin:0;font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.35;color:var(--navy)}
.dsub{margin:-4px 0 0;font-family:var(--serif);font-style:italic;color:var(--tan);font-size:15px}
.dmeta{display:flex;flex-wrap:wrap;gap:6px}
.meta{padding:1px 10px;border:1px solid var(--line2);border-radius:999px;background:#fff;color:var(--navy);font-size:13px}
.prev{border-left:4px solid var(--tan);padding-left:12px;display:flex;flex-direction:column;gap:4px}
.pvbody{display:flex;flex-direction:column;gap:3px}
.pvbody p{margin:0;font-size:14.5px;line-height:1.65;white-space:pre-line}
.pvbody p.li{padding-left:1.3em;text-indent:-1.3em}
.dact{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding-top:4px}
.ghost{min-height:40px;padding:0 20px;border:1px solid var(--line2);border-radius:4px;background:transparent;color:var(--text);font-size:14px;cursor:pointer}
.primary{min-height:40px;display:inline-flex;align-items:center;padding:0 24px;border:0;border-radius:4px;background:var(--navy);color:var(--card);font-size:14px;font-weight:700;text-decoration:none;cursor:pointer}
.primary:hover{background:#1E3C61}

/* ---------- 手機版 ---------- */
@media (max-width:760px){
  .wrap{padding:0 16px}
  .top .wrap{min-height:48px}
  .brand{font-size:16px}
  .topnav span{padding:12px 6px;font-size:13px}
  .topnav span:not(.on){display:none}
  .subbar .wrap{position:relative}
  .subbar .wrap::after{content:"";position:absolute;right:0;top:0;bottom:0;width:32px;background:linear-gradient(90deg,rgba(250,248,242,0),var(--card));pointer-events:none}
  .tab{padding:0 16px;font-size:14px}
  main.wrap{padding-top:14px;padding-bottom:32px}
  .phead h1{font-size:28px}
  .phead .en{font-size:14px}
  .lead{font-size:14px}
  .banner{margin:10px 0 12px}
  .card{padding:8px}
  /* 辭典表格：標籤格變橫條，按鈕變整列 */
  .grp{flex-direction:column;gap:6px}
  .glabel{max-width:none;flex:none;align-items:flex-start;text-align:left;padding:7px 12px;gap:2px}
  .glabel b{font-size:15px}
  .glabel b br{display:none}
  .gbody{flex:none;padding:8px;gap:6px}
  .btns{flex-direction:column;gap:6px}
  .btn{position:relative;justify-content:center;padding-left:30px;padding-right:30px}
  .btn::after{content:"›";position:absolute;right:14px;top:50%;transform:translateY(-52%);font-size:20px;line-height:1;opacity:.6}
  .btns .btn,.mc .btn{width:100%;min-height:44px;padding-top:6px;padding-bottom:6px}
  .btn.multi{padding-top:6px;padding-bottom:6px}
  /* 矩陣：上下堆疊 */
  .matrix,.matrix.lab{grid-template-columns:minmax(0,1fr);gap:6px}
  .mh{display:none}
  .ml{align-items:flex-start;text-align:left;padding:7px 12px;gap:1px}
  .ml b{font-size:15px}
  .mc{padding:8px;gap:6px;flex-direction:column;flex-wrap:nowrap}
  .mc .btn{flex:none}
  .mcap{display:block}
  /* 功能疊表 */
  .disc{align-self:stretch;justify-content:center}
  .tscroll{overflow-x:visible}
  table.stack{min-width:0;font-size:13px;line-height:1.25}
  .stack th,.stack td{padding:3px 2px}
  .stack thead th{font-size:12px;padding:4px 2px}
  .stack tbody th{padding-left:8px}
  .stack tr.gh td{padding:3px 8px;font-size:12.5px}
  /* 列表 */
  .toolbar input{flex-basis:100%;font-size:16px}
  .chips{flex-wrap:nowrap;overflow-x:auto;margin:8px -8px 2px;padding:2px 8px 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;min-height:38px}
  .row{padding:10px 4px}
  .rtitle{font-size:15.5px}
  .rtags{max-width:none;justify-content:flex-start}
  .feat{padding:12px}
  .feat .ft{font-size:18px}
  .note{font-size:13px}
  /* 彈窗：改為底部抽屜 */
  .modal{align-items:flex-end;padding:0}
  .dlg{width:100%;max-height:88vh;border-radius:16px 16px 0 0;border-bottom:0;padding:14px 18px calc(16px + env(safe-area-inset-bottom));gap:8px;transform:translateY(40px)}
  .dlg::before{content:"";align-self:center;width:40px;height:4px;border-radius:2px;background:var(--line2);margin-bottom:-2px}
  .dlg h2{font-size:22px}
  .dact .ghost,.dact .primary{flex:1 1 0;justify-content:center}
  .dact{flex-direction:row-reverse}
}
@media (prefers-reduced-motion:reduce){
  .panel,.panel.active,.stage.ready,.modal,.modal.open,.dlg,.tab,.btn,.collapse,.cin,.disc .chev{transition:none !important;transform:none}
  .row.enter,.endmsg.enter{animation:none !important}
}
</style>

<body>
{% include header.html %}

<div class="subbar" aria-label="理論文章子頁導覽">
  <div class="wrap">
    <div class="tabs" id="tabs" role="tablist" aria-label="理論文章分類"></div>
  </div>
</div>

<main class="wrap">
  <div class="stage" id="stage"></div>
</main>
{% include footer.html %}

<div class="modal" id="modal" aria-hidden="true">
  <div class="backdrop" id="backdrop"></div>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="dtop">
      <span class="dchip" id="mCat"></span>
      <button class="xbtn" id="mX" type="button" aria-label="關閉預覽">×</button>
    </div>
    <h2 id="mTitle"></h2>
    <p class="dsub" id="mSub" hidden></p>
    <div class="dmeta" id="mMeta" hidden></div>
    <div class="prev"><div class="pvbody" id="mPrev"></div></div>
    <div class="dact">
      <button class="ghost" id="mClose" type="button">關閉</button>
      <a class="primary" id="mRead" href="#">閱讀全文 →</a>
    </div>
  </div>
</div>

   {
    "t": "N人比較「抽象」嗎？",
    "url": "https://jungian16types.com/post-3890.html",
    "d": "2026年3月11日",
    "tags": [
     "直覺功能/類型",

    ],
    "pv": [
     "部分正確，但「抽象」有三種成因：一、直覺忽略客體本身，聚焦其引發的可能與意味；二、內傾本身處理內化的主觀客體，更接近日常所說的抽象（內傾感覺亦極抽象）；三、任何功能分化成熟後，都會因統覺（把經驗統合成自己的理解）而產生抽象性。不能因思維抽象就判為直覺類型。"
    ]
   },
   {
    "t": "雙內傾會變得「自閉」嗎？",
    "url": "https://jungian16types.com/post-3870.html",
    "d": "2026年2月25日",
    "tags": [
     "內傾功能/類型",
     "外傾功能/類型"
    ],
    "pv": [
     "不會。內傾指力比多流向內在客體，與社交內外向無關；意識內傾者（I型）的無意識是外傾的，會不自覺地影響外界，只是較難察覺。本文說明如何辨別：內傾者予人「深度」感、外傾者予人「廣度」感，且不能以是否社交外向來判斷。"
    ]
   },
   {
    "t": "Te代表效率快的意思嗎？",
    "url": "https://jungian16types.com/post-3834.html",

    "tags": [
     "邏輯功能/類型"
    ],
    "pv": [
     "不是。「Te＝效率」是社會人格學的定義，不適用於榮格。外傾邏輯（Te）屬理性功能，須先提取普遍原則再套用，面對臨場情況反而較慢；外傾感覺與外傾直覺更能即時把握變化。各功能在自己的領域都最具「效益」；Te追求的是程序的公正與客觀普世，而非速度。"
    ]

   {
    "t": "類型與創傷有關嗎？",
    "url": "https://jungian16types.com/post-3636.html",
    "d": "2026年1月21日",
    "tags": [
     "哲學/精神分析基礎概念"
    ],
    "pv": [
     "有關，但不是「某類型創傷最多」。精神分析認為人格源於早期母子分離的創傷，主導功能就是我們應對慾望受挫的主要手段，所以每種類型都是創傷的產物，只是應對方式不同：理性類型尋找可把握的資訊，非理性類型快速適應環境。請勿比慘，也勿否定他人的創傷。"
    ]
   },
   {
    "t": "類型的道德、真理與意義",
    "url": "https://jungian16types.com/post-3378.html",
    "d": "2026年1月17日",
    "tags": [],
    "pv": [
     "「道德」「真理」「意義」三詞，在各類型眼中定義不同。道德：外傾邏輯重公共規條，內傾邏輯堅持自洽的內在格言，情感類型近乎情感共識，非理性類型視之為基本事實。真理：邏輯者是統領一切的原則，情感者是真善美，感覺者是事實，直覺者是靈光一現。意義：外傾重情境效果，內傾重客體內在。"
    ]
   },
   {
    "t": "N人的想象力比較強？",
    "url": "https://jungian16types.com/post-3368.html",
    "d": "2026年1月17日",
    "tags": [
     "直覺功能/類型",
     "功能定義"
    ],
    "pv": [
     "不是。榮格把「幻想」分為幻象與想像活動，後者是所有功能都有的普遍心理活動，並非直覺專利；直覺的想像多是無意識的靈光，沒有具體畫面。例如內傾感覺的藝術家想像出鮮明的體感場景，邏輯者想像結構，情感者想像人際情境。"
    ]
   },
   {
    "t": "Si是遵循傳統或習慣的意思嗎？",
    "url": "https://jungian16types.com/post-3361.html",
    "d": "2026年1月17日",
    "tags": [
     "理性非理性",
     "理性功能/類型",
     "非理性功能/類型",
     "功能定義",
     "感覺功能/類型"
    ],
    "pv": [
     "不是。內傾感覺（Si）是非理性功能，感知客體留下的主觀體感印象，不帶對常理的判斷；傳統屬集體常理，是理性功能的範疇。重視傳統的形象，更接近以理性功能（邏輯或情感）為主導、感覺為輔助的四種類型；而「重視已存」不等於認同，他們也可以選擇改革。"
    ]
   },
   {
    "t": "類型之間的相處契合度",
    "url": "https://jungian16types.com/post-3342.html",
    "d": "2026年1月17日",
    "tags": [],
    "pv": [
     "類型能準確預測相處契合度嗎？不能。目前沒有相關統計或理論，網上的「官配」多屬想像。從榮格理論可推出三道鴻溝：內傾與外傾、理性與非理性、對軸功能（邏輯↔情感、感覺↔直覺）。人常被完全相反的類型吸引（阿尼瑪／阿尼姆斯），而相同類型也未必合得來。請勿以類型挑選對象。"
    ]
   },
   {
    "t": "Fi = Follow Your Heart?",
    "url": "https://jungian16types.com/post-2215.html",
    "d": "2026年1月13日",
    "tags": [
     "情感功能/類型"
    ],
    "pv": [
     "不能把內傾情感（Fi）簡化為「跟隨內心」：榮格認為每種類型的主導功能都是力比多（慾望）的呈現，故每個類型（包括外傾類型）都在遵從自己的慾望。本文釐清Fi的定義：向內流動的情感力量、沉默而英雄式的同理，以及內部自洽並符合原型意象的主觀道德原則，並非自私或我行我素。"
    ]
   },
   {
    "t": "既然Se很衝動，那Ni就應該很理性？",
    "url": "https://jungian16types.com/post-2208.html",
    "d": "2026年1月13日",
    "tags": [],

    ]
   },
   {
    "t": "因為我很奇怪，所以我是稀有類型？",

    ]
   },

function matrixHtml(sec){
  var h = '<div class="matrix'+(sec.hasLabel?' lab':'')+'" style="--n:'+sec.cols.length+'">';
  if(sec.hasLabel){
    h += sec.corner ? '<div class="mh">'+esc(sec.corner)+'</div>' : '<div class="mh blank" aria-hidden="true"></div>';
  }
  sec.cols.forEach(function(c){
    h += c ? '<div class="mh">'+esc(c)+'</div>' : '<div class="mh blank" aria-hidden="true"></div>';
  });
  sec.rows.forEach(function(r){
    if(sec.hasLabel){
      h += '<div class="ml"><b>'+esc(r.label)+'</b>'+(r.sub?'<small>'+esc(r.sub)+'</small>':'')+'</div>';
    }
    r.cells.forEach(function(items, ci){
      h += '<div class="mc">'+(sec.cols[ci]?'<span class="mcap">'+esc(sec.cols[ci])+'</span>':'')+
        items.map(btnHtml).join("")+'</div>';
    });
  });
  return h + '</div>';
}
function stackHtml(sec, key){

function secHtml(sec, key){

var PAGE = 6;
var lists = {};
var THEORY_URL = {{ '/theory/' | absolute_url | jsonify }};
var SECTION_PATHS = {basics:"basics/",types:"types/",faq:"faq/",sources:"sources/",compare:"compare/",commentary:"commentary/"};
var SITE_TITLE = {{ site.title | default: "經典榮格 Classic Jung" | jsonify }};
var canonicalEl = document.querySelector('link[rel="canonical"]');
var descriptionEl = document.querySelector('meta[name="description"]');
function updateSectionSeo(cat){
  document.title = cat.name + "｜理論文章｜" + SITE_TITLE;
  if(descriptionEl) descriptionEl.content = cat.lead + " 在經典榮格理論文章中閱讀相關概念、原文與說明。";
  if(canonicalEl){
    canonicalEl.href = new URL(SECTION_PATHS[cat.key], THEORY_URL).href;
  }
}
function setupList(cat){
  var st = lists[cat.key] = { tag:"全部", q:"", shown:PAGE };
  var chips = $("#chips-"+cat.key);
  chips.innerHTML = ["全部"].concat(cat.tags).map(function(t){
    return '<button class="chip" type="button" data-tag="'+esc(t)+'" aria-pressed="'+(t==="全部")+'">'+esc(t)+'</button>';
  }).join("");
  chips.addEventListener("click", function(e){
    var b = e.target.closest(".chip"); if(!b) return;
    st.tag = b.getAttribute("data-tag"); st.shown = PAGE; renderList(cat, -1);
  });
  $("#q-"+cat.key).addEventListener("input", function(e){ st.q = e.target.value.trim().toLowerCase(); st.shown = PAGE; renderList(cat, -1); });
  $("#more-"+cat.key).addEventListener("click", function(){ var from = st.shown; st.shown += PAGE; renderList(cat, from); });
  renderList(cat, -1);
}
/* animFrom >= 0：從該筆開始的新列依序淡入（載入更多）；-1：不做動畫 */
function renderList(cat, animFrom){
  var st = lists[cat.key];
  var active = st.tag !== "全部" || !!st.q;
  var hit = cat.items.filter(function(it){
    if(st.tag !== "全部" && it.tags.indexOf(st.tag) < 0) return false;
    if(st.q){
      var hay = (it.t+" "+it.pv.join(" ")+" "+it.tags.join(" ")).toLowerCase();
      if(hay.indexOf(st.q) < 0) return false;
    }
    return true;
  });
  /* 站主銳評：沒有篩選時，最新一篇用置頂卡片顯示，列表從第二篇開始 */
  var feat = (cat.featured && !active && hit.length) ? hit[0] : null;
  var listItems = feat ? hit.slice(1) : hit;
  var fEl = $("#feat-"+cat.key);
  if(fEl){
    if(feat){
      fEl.setAttribute("href", feat.url); fEl.setAttribute("target", LINK_TARGET);
      if(LINK_TARGET==="_blank") fEl.setAttribute("rel","noopener");
      fEl.innerHTML = '<span class="flag">最新一篇</span><span class="ft">'+esc(feat.t)+'</span>'+
        feat.pv.map(function(p){return '<span class="fe">'+esc(p)+'</span>';}).join("")+'<span class="fd">'+esc(feat.d)+'</span>';
      fEl.hidden = false;
    } else { fEl.hidden = true; }
  }
  var base = feat ? 1 : 0;
  var vis = listItems.slice(0, st.shown);
  var animating = animFrom >= 0;
  $("#rows-"+cat.key).innerHTML = vis.length ? vis.map(function(it, i){ return rowHtml(it, i, animFrom); }).join("")
    : (hit.length ? '' : '<div class="empty">找不到符合的文章，換個關鍵字或標籤試試。</div>');
  var total = cat.items.length;
  $("#count-"+cat.key).textContent = (active ? "符合 "+hit.length+" 篇（共 "+total+" 篇）" : "共 "+total+" 篇")+" · 依最新排序";

  var all = vis.length >= listItems.length;
  var more = $("#more-"+cat.key), shown = $("#shown-"+cat.key), end = $("#end-"+cat.key);
  more.hidden = all || !hit.length;
  shown.textContent = "已顯示 "+(vis.length+base)+" / "+hit.length;
  shown.hidden = all || !hit.length;
  end.classList.remove("enter");
  if(all && hit.length){
    end.textContent = "已顯示全部 "+hit.length+" 篇";
    end.hidden = false;
    if(animating){
      end.style.setProperty("--i", String(vis.length - animFrom + 1));
      void end.offsetWidth;
      end.classList.add("enter");
    }
  } else {
    end.hidden = true;
  }
  [].forEach.call($("#chips-"+cat.key).children, function(c){
    c.setAttribute("aria-pressed", String(c.getAttribute("data-tag") === st.tag));
  });
  /* 按鈕已消失時，把焦點交給第一筆新內容，避免鍵盤使用者迷失 */
  if(animating && all){
    var first = $("#rows-"+cat.key).children[animFrom];
    if(first && first.focus) first.focus({preventScroll:true});
  }
}

CATS.forEach(function(cat, i){
  var isList = !!cat.items;
  var p = document.createElement("section");
  p.className = "panel"; p.id = "panel-"+cat.key; p.setAttribute("role","tabpanel");
  p.setAttribute("aria-labelledby","tab-"+cat.key); p.setAttribute("aria-hidden","true");
  p.innerHTML = isList ? listPanel(cat) : dictPanel(cat);
  stage.appendChild(p); panels[cat.key] = p;
  if(isList) setupList(cat);

  var t = document.createElement("a");
  t.className = "tab" + (i===3 ? " sep" : ""); t.id = "tab-"+cat.key;
  t.href = new URL(SECTION_PATHS[cat.key], THEORY_URL).href;
  t.setAttribute("role","tab"); t.setAttribute("aria-controls","panel-"+cat.key);
  t.setAttribute("aria-selected","false"); t.tabIndex = -1; t.textContent = cat.name;
  t.addEventListener("click", function(event){ event.preventDefault(); go(cat.key); });
  tabsEl.appendChild(t); tabs[cat.key] = t;
});

/* 功能疊表：展開／收合 */
[].forEach.call(document.querySelectorAll(".disc"), function(btn){
  btn.addEventListener("click", function(){
    var box = document.getElementById(btn.getAttribute("aria-controls"));
    var open = btn.getAttribute("aria-expanded") !== "true";
    btn.setAttribute("aria-expanded", String(open));
    $(".dl", btn).textContent = open ? "收合表格" : "展開表格";
    box.classList.toggle("open", open);
  });
});

function fit(){ if(current) stage.style.height = panels[current].offsetHeight + "px"; }
if(window.ResizeObserver){
  var ro = new ResizeObserver(fit);
  Object.keys(panels).forEach(function(k){ ro.observe(panels[k]); });
}
window.addEventListener("resize", fit);

function centerTab(key, smooth){
  var t = tabs[key];
  var left = Math.max(0, t.offsetLeft - (tabsEl.clientWidth - t.offsetWidth) / 2);
  if(tabsEl.scrollTo){ tabsEl.scrollTo({left:left, behavior: smooth ? "smooth" : "auto"}); } else { tabsEl.scrollLeft = left; }
}
function show(key, fromUser){
  if(!panels[key] || key === current) return;
  var first = current === null;
  if(current){
    panels[current].classList.remove("active"); panels[current].setAttribute("aria-hidden","true");
    tabs[current].setAttribute("aria-selected","false"); tabs[current].tabIndex = -1;
  }
  current = key;
  updateSectionSeo(CATS.filter(function(cat){ return cat.key === key; })[0]);
  panels[key].classList.add("active"); panels[key].setAttribute("aria-hidden","false");
  tabs[key].setAttribute("aria-selected","true"); tabs[key].tabIndex = 0;
  fit();
  if(first){ requestAnimationFrame(function(){ requestAnimationFrame(function(){ stage.classList.add("ready"); }); }); }
  centerTab(key, !first);
  if(fromUser){
    var top = stage.getBoundingClientRect().top + window.scrollY - $(".subbar").offsetHeight - 16;
    if(window.scrollY > top) window.scrollTo(0, Math.max(0, top));
  }
}
function go(key){
  show(key, true);
  try{
    var nextUrl = new URL(SECTION_PATHS[key], THEORY_URL);
    history.pushState(null, "", nextUrl.href);
  }catch(e){}
}
function fromLocation(){
  var currentPath = location.pathname.replace(/\/+$/, "") + "/";
  var pathSection = Object.keys(SECTION_PATHS).filter(function(key){return new URL(SECTION_PATHS[key], THEORY_URL).pathname === currentPath;})[0];
  if(pathSection) return pathSection;
  var params = new URLSearchParams(location.search);
  var section = params.get("section");
  if(panels[section]) return section;
  var legacyHash = (location.hash||"").replace("#","");
  return panels[legacyHash] ? legacyHash : (panels[window.__START] ? window.__START : CATS[0].key);
}
window.addEventListener("popstate", function(){ show(fromLocation(), true); });
window.addEventListener("hashchange", function(){ show(fromLocation(), true); });
tabsEl.addEventListener("keydown", function(e){
  var keys = CATS.map(function(c){return c.key;}), i = keys.indexOf(current), n = i;
  if(e.key==="ArrowRight") n = (i+1)%keys.length;
  else if(e.key==="ArrowLeft") n = (i-1+keys.length)%keys.length;
  else if(e.key==="Home") n = 0;
  else if(e.key==="End") n = keys.length-1;
  else return;
  e.preventDefault(); go(keys[n]); tabs[keys[n]].focus();
});
window.__START = {{ page.section | default: "basics" | jsonify }};
show(fromLocation(), false);

/* ---------- 預覽彈窗（辭典按鈕） ---------- */
var modal = $("#modal"), lastFocus = null;
function pvHtml(lines){
  return lines.map(function(l){
    return '<p'+(/^(・|\d+\.\s)/.test(l)?' class="li"':'')+'>'+esc(l)+'</p>';
  }).join("");
}
function openModal(id){
  var it = store[id]; if(!it) return;
  lastFocus = document.activeElement;
  $("#mCat").textContent = it.where;
  $("#mTitle").textContent = it.t;
  var sub = $("#mSub"); sub.textContent = it.en || ""; sub.hidden = !it.en;
  var mm = $("#mMeta");
  mm.innerHTML = (it.meta||[]).map(function(m){return '<span class="meta">'+esc(m)+'</span>';}).join("");
  mm.hidden = !(it.meta && it.meta.length);
  $("#mPrev").innerHTML = pvHtml(it.pv);
  var rd = $("#mRead");
  rd.setAttribute("href", it.url); rd.setAttribute("target", LINK_TARGET);
  if(LINK_TARGET==="_blank") rd.setAttribute("rel","noopener"); else rd.removeAttribute("rel");
  rd.setAttribute("title", "文章：" + it.art);
  modal.classList.add("open"); modal.setAttribute("aria-hidden","false");
  document.body.style.overflow = "hidden";
  $(".dlg").scrollTop = 0;
  $("#mX").focus();
}
function closeModal(){
  if(!modal.classList.contains("open")) return;
  modal.classList.remove("open"); modal.setAttribute("aria-hidden","true");
  document.body.style.overflow = "";
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-id]");
  if(b && !modal.contains(b)) openModal(b.getAttribute("data-id"));
});
$("#mX").addEventListener("click", closeModal);
$("#mClose").addEventListener("click", closeModal);
$("#backdrop").addEventListener("click", closeModal);
document.addEventListener("keydown", function(e){
  if(!modal.classList.contains("open")) return;
  if(e.key === "Escape"){ closeModal(); return; }
  if(e.key === "Tab"){
    var f = [].filter.call(modal.querySelectorAll("button, a[href]"), function(el){ return !el.hidden; });
    if(!f.length) return;
    var first = f[0], last = f[f.length-1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});
})();
</script>
