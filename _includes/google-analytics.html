{% assign google_analytics_id = site.google_analytics_id | strip %}
{% if google_analytics_id != empty %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ google_analytics_id | escape }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ google_analytics_id | escape }}');
</script>
{% endif %}
