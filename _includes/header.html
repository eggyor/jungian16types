<header class="site-header" id="site-top">
  <div class="header-inner">
    <a class="header-logo" href="{{ '/' | relative_url }}" aria-label="回到主頁"><img src="{{ '/img/logo2.jpeg' | relative_url }}" alt="經典榮格"></a>
    <input type="checkbox" id="site-menu-toggle" class="site-menu-toggle">
    <label for="site-menu-toggle" class="site-burger" aria-label="開啟導覽選單">☰</label>
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="切換夜間模式" title="切換星夜模式"><svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.2 15.1A8.1 8.1 0 0 1 8.9 4.8 8.2 8.2 0 1 0 19.2 15.1Z"/><path d="M17.5 3.5v3M16 5h3M21 9v2M20 10h2"/></svg><svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg><span class="theme-toggle-label" data-theme-label>夜間模式</span></button>
    <nav class="main-nav" aria-label="主導覽">
      <a href="{{ '/' | relative_url }}">主頁</a>
      <a href="{{ '/quiz/' | relative_url }}">類型測驗</a>
      <a href="{{ '/theory/' | relative_url }}">理論文章</a>
      <a href="{{ '/alchemy/' | relative_url }}">煉金工房</a>
      <a href="{{ '/about/' | relative_url }}">關於本站</a>
    </nav>
    <div class="site-search">
      <form class="site-search-form" action="{{ '/search/' | relative_url }}" method="get" role="search" data-site-search data-search-index="{{ '/search.json' | relative_url }}">
        <label class="site-search-label" for="site-search-input">搜尋網站內容</label>
        <input class="site-search-input" id="site-search-input" name="q" type="search" placeholder="搜尋文章與頁面" autocomplete="off" aria-autocomplete="list" aria-controls="site-search-results">
        <button class="site-search-submit" type="submit" aria-label="搜尋"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.5"></circle><path d="m16 16 4.2 4.2"></path></svg></button>
      </form>
      <div class="site-search-results" id="site-search-results" role="listbox" aria-label="搜尋建議" hidden></div>
    </div>
  </div>
</header>

<script>
(function(){
  const form=document.querySelector('[data-site-search]');
  if(!form)return;
  const input=form.querySelector('input[name="q"]');
  const results=document.querySelector('#site-search-results');
  const indexUrl=form.dataset.searchIndex;
  const action=form.action;
  let indexPromise=null;
  function normalize(value){return String(value||'').normalize('NFKC').toLocaleLowerCase().trim().replace(/\s+/g,' ');}
  function loadIndex(){
    if(!indexPromise)indexPromise=fetch(indexUrl).then(function(response){if(!response.ok)throw new Error('Search index unavailable');return response.json();}).then(function(items){return items.map(function(item){return Object.assign({},item,{_searchTitle:normalize(item.title),_searchContent:normalize(item.content)});});});
    return indexPromise;
  }
  function excerpt(item,terms){
    const text=String(item.content||'').replace(/\s+/g,' ').trim();
    if(!text)return item.type||'網站頁面';
    const lower=normalize(text);let position=-1;
    for(const term of terms){const found=lower.indexOf(term);if(found>=0&&(position<0||found<position))position=found;}
    if(position<0)return text.slice(0,130)+(text.length>130?'…':'');
    const start=Math.max(0,position-48),end=Math.min(text.length,position+115);
    return (start>0?'…':'')+text.slice(start,end)+(end<text.length?'…':'');
  }
  function makeSuggestion(item,terms){
    const link=document.createElement('a');link.className='site-search-result';link.href=item.url;link.role='option';
    const title=document.createElement('strong');title.textContent=item.title||'未命名頁面';
    const description=document.createElement('small');description.textContent=excerpt(item,terms);
    link.append(title,description);return link;
  }
  function renderSuggestions(items,terms,query){
    results.replaceChildren();
    if(!query){results.hidden=true;return;}
    const status=document.createElement('p');status.className='site-search-status';status.textContent=items.length?'相關頁面':'沒有找到相關內容';results.append(status);
    items.slice(0,5).forEach(function(item){results.append(makeSuggestion(item,terms));});
    const all=document.createElement('a');all.className='site-search-all';all.href=action+'?q='+encodeURIComponent(input.value.trim());all.textContent='查看全部搜尋結果';results.append(all);
    results.hidden=false;
  }
  form.addEventListener('submit',function(event){
    const query=input.value.trim();if(!query){event.preventDefault();input.focus();return;}
    event.preventDefault();window.location.assign(action+'?q='+encodeURIComponent(query));
  });
  input.addEventListener('input',function(){
    const query=normalize(input.value),terms=query.split(' ').filter(Boolean);
    if(!terms.length){renderSuggestions([],terms,'');return;}
    loadIndex().then(function(items){
      const matches=items.map(function(item){
        const title=item._searchTitle,content=item._searchContent,score=terms.reduce(function(total,term){return total+(title.includes(term)?10:0)+(content.includes(term)?1:0);},0)+(title.startsWith(query)?20:0);
        return {item:item,score:score};
      }).filter(function(entry){return terms.every(function(term){return entry.item._searchTitle.includes(term)||entry.item._searchContent.includes(term);});})
        .sort(function(a,b){return b.score-a.score;}).map(function(entry){return entry.item;});
      renderSuggestions(matches,terms,query);
    }).catch(function(){renderSuggestions([],terms,query);});
  });
  document.addEventListener('pointerdown',function(event){if(!form.parentElement.contains(event.target))results.hidden=true;});
  input.addEventListener('keydown',function(event){if(event.key==='Escape'){results.hidden=true;}});
  input.addEventListener('focus',function(){if(input.value.trim())input.dispatchEvent(new Event('input'));});
})();
</script>
