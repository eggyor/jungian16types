<style>
/* Shared site header: hover opens the theory menu; click can pin or dismiss it. */
.site-header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.98);border-bottom:1px solid #e6e7e9}
.header-inner{max-width:1980px;min-height:150px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;gap:46px}
.header-logo{display:block;flex:none;width:108px;height:106px}.header-logo img{display:block;width:100%;height:100%;object-fit:contain}
.main-nav{display:flex;align-items:center;gap:48px;min-width:0}.main-nav>a,.nav-dropdown-toggle{font-size:21px;line-height:1.4;color:#394253;text-decoration:none;white-space:nowrap;cursor:pointer}
.main-nav>a:hover,.main-nav>a:focus-visible,.nav-dropdown-toggle:hover,.nav-dropdown-toggle:focus-visible{color:#65764a}
.nav-dropdown{position:relative}.nav-dropdown-toggle{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;padding:0;border:0;background:transparent;font:inherit;font-size:21px;pointer-events:auto}
.nav-caret{display:block;width:0;height:0;margin-left:5px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #111;transition:transform .2s ease}
.nav-dropdown.is-open>.nav-dropdown-toggle .nav-caret{transform:rotate(180deg)}
.dropdown-menu{display:none;position:absolute;left:-35px;top:calc(100% + 34px);width:264px;padding:6px 0;background:#fff;box-shadow:0 8px 24px rgba(25,31,42,.16);z-index:35}
.dropdown-menu a{display:flex;align-items:center;justify-content:center;min-height:61px;padding:12px 16px;border-bottom:1px solid #d7d7d7;color:#394253;text-decoration:none;font-size:20px;white-space:nowrap}
.dropdown-menu a:last-child{border-bottom:0}.dropdown-menu a:hover,.dropdown-menu a:focus{background:#f4f5f6;color:#65764a}
.nav-dropdown::after{content:"";position:absolute;left:-35px;right:-35px;top:100%;height:34px}
.nav-dropdown .dropdown-menu{display:none!important}.nav-dropdown.is-open .dropdown-menu{display:block!important}
.site-menu-toggle,.site-burger{display:none}
.site-search{position:relative;flex:0 1 300px;width:min(300px,24vw);margin-left:auto}
.site-search-form{display:flex;align-items:center;min-height:46px;border:1px solid #d9dde4;border-radius:999px;background:#f8f9fb;transition:border-color .18s ease,box-shadow .18s ease,background .18s ease}
.site-search-form:focus-within{border-color:#a8b686;background:#fff;box-shadow:0 0 0 3px rgba(168,182,134,.18)}
.site-search-input{width:100%;min-width:0;padding:0 8px 0 17px;border:0;outline:0;background:transparent;color:#263044;font:inherit;font-size:16px;line-height:1.4}
.site-search-input::placeholder{color:#7b8492}
.site-search-submit{display:grid;place-items:center;flex:none;width:40px;height:40px;margin-right:3px;padding:0;border:0;border-radius:50%;background:transparent;color:#394253;cursor:pointer}
.site-search-submit:hover{background:#eef1e8;color:#65764a}
.site-search-submit svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.site-search-results{position:absolute;top:calc(100% + 10px);right:0;z-index:60;width:min(420px,calc(100vw - 32px));max-height:min(70vh,560px);overflow:auto;padding:8px;border:1px solid #e3e6eb;border-radius:14px;background:#fff;box-shadow:0 14px 36px rgba(25,31,42,.18)}
.site-search-results[hidden]{display:none}
.site-search-result{display:block;padding:11px 12px;border-radius:9px;color:#263044;text-decoration:none}
.site-search-result:hover,.site-search-result:focus-visible{outline:0;background:#f4f6f1}
.site-search-result strong{display:block;font-size:15px;line-height:1.45}
.site-search-result small{display:block;margin-top:3px;color:#667085;font-size:12px;line-height:1.55}
.site-search-status{margin:3px 8px 8px;color:#667085;font-size:13px}
.site-search-all{display:block;margin-top:5px;padding:11px 12px;border-top:1px solid #eceef1;color:#52613a;font-size:14px;font-weight:700;text-align:center;text-decoration:none}
.site-search-all:hover{text-decoration:underline;text-underline-offset:3px}
.site-search-label{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:1050px){.header-inner{gap:28px}.main-nav{gap:26px}.main-nav>a,.nav-dropdown-toggle{font-size:18px}}
@media(max-width:1050px) and (min-width:761px){.site-search{flex-basis:240px;width:240px}.site-search-input{font-size:14px}.header-inner{gap:22px}}
@media(max-width:760px){.header-inner{position:relative;min-height:84px;padding:10px 18px;gap:12px}.header-logo{width:62px;height:62px}.site-search{flex:1 1 auto;width:auto;min-width:0;margin-left:0}.site-search-form{min-height:42px}.site-search-input{padding-left:13px;font-size:14px}.site-search-submit{width:36px;height:36px}.site-burger{display:block;margin-left:0;font-size:28px;cursor:pointer;color:#394253}.site-menu-toggle{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.main-nav{display:none;position:absolute;top:84px;left:0;right:0;background:#fff;align-items:stretch;flex-direction:column;gap:0;padding:8px 18px 14px;box-shadow:0 8px 16px rgba(0,0,0,.12)}#site-menu-toggle:checked~.main-nav{display:flex}.main-nav>a,.nav-dropdown-toggle{padding:12px 8px;font-size:17px}.nav-dropdown{width:100%}.nav-dropdown::after{display:none}.dropdown-menu{position:static;top:auto;left:auto;width:100%;box-shadow:none;padding:0 0 0 14px}.dropdown-menu a{justify-content:flex-start;min-height:44px;font-size:16px}.site-search-results{right:-2px;top:calc(100% + 8px)}}
</style>
<header class="site-header" id="site-top">
  <div class="header-inner">
    <a class="header-logo" href="{{ '/' | relative_url }}" aria-label="回到主頁"><img src="{{ '/img/logo2.jpeg' | relative_url }}" alt="經典榮格"></a>
    <input type="checkbox" id="site-menu-toggle" class="site-menu-toggle">
    <label for="site-menu-toggle" class="site-burger" aria-label="開啟導覽選單">☰</label>
    <nav class="main-nav" aria-label="主導覽">
      <a href="{{ '/' | relative_url }}">主頁</a>
      <a href="{{ '/page-1324.html' | relative_url }}">類型測驗</a>
      <div class="nav-dropdown">
        <a class="nav-dropdown-toggle" href="{{ '/theory/' | relative_url }}" aria-expanded="false" aria-controls="theory-submenu">理論文章 <span class="nav-caret" aria-hidden="true"></span></a>
        <div class="dropdown-menu" id="theory-submenu" aria-label="理論文章分類">
          <a href="{{ '/page-1259.html' | relative_url }}">基礎概念101</a>
          <a href="{{ '/page-1271.html' | relative_url }}">類型描述</a>
          <a href="{{ '/page-1286.html' | relative_url }}">常見問題</a>
          <a href="{{ '/page-1292.html' | relative_url }}">榮格原文</a>
          <a href="{{ '/page-1298.html' | relative_url }}">系統對比</a>
          <a href="{{ '/page-1304.html' | relative_url }}">站主銳評</a>
        </div>
      </div>
      <a href="{{ '/page-1137.html' | relative_url }}">關於本站</a>
    </nav>
    <div class="site-search">
      <form class="site-search-form" action="{{ '/search/' | relative_url }}" method="get" role="search" data-site-search data-search-index="{{ '/search.json' | relative_url }}">
        <label class="site-search-label" for="site-search-input">搜尋網站內容</label>
        <input class="site-search-input" id="site-search-input" name="q" type="search" placeholder="搜尋文章與頁面" autocomplete="off" aria-autocomplete="list" aria-controls="site-search-results">
        <button class="site-search-submit" type="submit" aria-label="搜尋"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.5"></circle><path d="m16 16 4.2 4.2"></path></svg></button>
      </form>
      <div class="site-search-results" id="site-search-results" role="listbox" aria-label="搜尋建議" hidden></div>
    </div>
  </div>
</header>
<script>
(function(){
  const menu=document.querySelector('.nav-dropdown');
  const toggle=document.querySelector('.nav-dropdown-toggle');
  const submenu=document.querySelector('#theory-submenu');
  if(!menu||!toggle||!submenu)return;
  let hoverOpen=false,closeTimer=null;
  function update(){menu.classList.toggle('is-open',hoverOpen);toggle.setAttribute('aria-expanded',String(hoverOpen));}
  function keepOpen(){if(closeTimer){clearTimeout(closeTimer);closeTimer=null;}}
  function scheduleClose(){keepOpen();closeTimer=setTimeout(function(){closeTimer=null;hoverOpen=false;update();},300);}
  toggle.addEventListener('pointerenter',function(){keepOpen();hoverOpen=true;update();});
  toggle.addEventListener('pointerleave',scheduleClose);
  submenu.addEventListener('pointerenter',function(){keepOpen();if(hoverOpen)update();});
  submenu.addEventListener('pointerleave',scheduleClose);
  menu.addEventListener('focusin',function(){keepOpen();hoverOpen=true;update();});
  menu.addEventListener('focusout',function(event){if(!menu.contains(event.relatedTarget))scheduleClose();});
  document.addEventListener('keydown',function(event){if(event.key==='Escape'){keepOpen();hoverOpen=false;update();toggle.focus();}});
})();
</script>
<script>
(function(){
  const form=document.querySelector('[data-site-search]');
  if(!form)return;
  const input=form.querySelector('input[name="q"]');
  const results=document.querySelector('#site-search-results');
  const indexUrl=form.dataset.searchIndex;
  const action=form.action;
  let indexPromise=null;
  function normalize(value){return String(value||'').normalize('NFKC').toLocaleLowerCase().trim().replace(/\s+/g,' ');}
  function loadIndex(){
    if(!indexPromise)indexPromise=fetch(indexUrl).then(function(response){if(!response.ok)throw new Error('Search index unavailable');return response.json();}).then(function(items){return items.map(function(item){return Object.assign({},item,{_searchTitle:normalize(item.title),_searchContent:normalize(item.content)});});});
    return indexPromise;
  }
  function excerpt(item,terms){
    const text=String(item.content||'').replace(/\s+/g,' ').trim();
    if(!text)return item.type||'網站頁面';
    const lower=normalize(text);let position=-1;
    for(const term of terms){const found=lower.indexOf(term);if(found>=0&&(position<0||found<position))position=found;}
    if(position<0)return text.slice(0,130)+(text.length>130?'…':'');
    const start=Math.max(0,position-48),end=Math.min(text.length,position+115);
    return (start>0?'…':'')+text.slice(start,end)+(end<text.length?'…':'');
  }
  function makeSuggestion(item,terms){
    const link=document.createElement('a');link.className='site-search-result';link.href=item.url;link.role='option';
    const title=document.createElement('strong');title.textContent=item.title||'未命名頁面';
    const description=document.createElement('small');description.textContent=excerpt(item,terms);
    link.append(title,description);return link;
  }
  function renderSuggestions(items,terms,query){
    results.replaceChildren();
    if(!query){results.hidden=true;return;}
    const status=document.createElement('p');status.className='site-search-status';status.textContent=items.length?'相關頁面':'沒有找到相關內容';results.append(status);
    items.slice(0,5).forEach(function(item){results.append(makeSuggestion(item,terms));});
    const all=document.createElement('a');all.className='site-search-all';all.href=action+'?q='+encodeURIComponent(input.value.trim());all.textContent='查看全部搜尋結果';results.append(all);
    results.hidden=false;
  }
  form.addEventListener('submit',function(event){
    const query=input.value.trim();if(!query){event.preventDefault();input.focus();return;}
    event.preventDefault();window.location.assign(action+'?q='+encodeURIComponent(query));
  });
  input.addEventListener('input',function(){
    const query=normalize(input.value),terms=query.split(' ').filter(Boolean);
    if(!terms.length){renderSuggestions([],terms,'');return;}
    loadIndex().then(function(items){
      const matches=items.map(function(item){
        const title=item._searchTitle,content=item._searchContent,score=terms.reduce(function(total,term){return total+(title.includes(term)?10:0)+(content.includes(term)?1:0);},0)+(title.startsWith(query)?20:0);
        return {item:item,score:score};
      }).filter(function(entry){return terms.every(function(term){return entry.item._searchTitle.includes(term)||entry.item._searchContent.includes(term);});})
        .sort(function(a,b){return b.score-a.score;}).map(function(entry){return entry.item;});
      renderSuggestions(matches,terms,query);
    }).catch(function(){renderSuggestions([],terms,query);});
  });
  document.addEventListener('pointerdown',function(event){if(!form.parentElement.contains(event.target))results.hidden=true;});
  input.addEventListener('keydown',function(event){if(event.key==='Escape'){results.hidden=true;}});
  input.addEventListener('focus',function(){if(input.value.trim())input.dispatchEvent(new Event('input'));});
})();
</script>
